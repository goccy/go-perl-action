name: Release
# A release is a tag vMAJOR.MINOR.PATCH (v1.0.0). Pushing one points the
# tags vMAJOR.MINOR and vMAJOR (v1.0, v1) at the same commit, so that
# `uses: goccy/go-perl-action/setup@v1` follows the latest release of v1.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Point the major and minor tags at the release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          minor=${VERSION%.*}
          major=${minor%.*}
          git tag -f "$minor" "$GITHUB_SHA"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$minor" "refs/tags/$major"
